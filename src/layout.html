<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}} | {{name}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{#if noindex}}<meta name="robots" content="noindex,nofollow">{{/if}}
<meta property="og:site_name" content="{{name}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}} | {{name}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{url}}/assets/img/og-default.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#20201e">
<link rel="preload" href="/assets/fonts/dm-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/libre-caslon-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/styles.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "Battram Associates",
  "url": "{{url}}",
  "telephone": "+44 1442 890019",
  "email": "{{email}}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "48 High Street",
    "addressLocality": "Tring",
    "addressRegion": "Hertfordshire",
    "postalCode": "HP23 5AG",
    "addressCountry": "GB"
  },
  "areaServed": "Northern Home Counties",
  "description": "Independent surveying, heritage and architectural design practice based in Tring, Hertfordshire."
}
</script>
</head>
<body class="page-{{slug}}">
<a class="skip" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{body}}
</main>
{{> accreditations}}
{{> footer}}
<script src="/js/site.js" defer></script>
</body>
</html>
