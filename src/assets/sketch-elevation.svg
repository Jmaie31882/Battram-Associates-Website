<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" fill="none" stroke="#20201e" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round" font-family="DM Sans, Arial, sans-serif">
