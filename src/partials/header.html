<header class="site-header">
  <a class="brand" href="/" aria-label="{{logo_alt}} home">
    <img class="mono" src="{{logo_mono}}" alt="" height="64">
    <span class="wordmark">
      <span class="name">{{logo_line1}}<br>{{logo_line2}}</span>
      {{#if logo_sub}}<span class="sub">{{logo_sub}}</span>{{/if}}
      <span class="tag">{{logo_tag}}</span>
    </span>
  </a>
  <button class="menu" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
  <nav id="site-nav" class="site-nav" aria-label="Main">
    <a href="/"{{nav_index}}>Home</a>
    <a href="/surveying/"{{nav_surveying}}>Surveying</a>
    <a href="/heritage/"{{nav_heritage}}>Heritage</a>
    <a href="/design/"{{nav_design}}>The Design Studio</a>
    <a href="/projects/"{{nav_projects}}>Projects</a>
    <a href="/about/"{{nav_about}}>About</a>
    <a href="/contact/"{{nav_contact}}>Contact</a>
  </nav>
</header>
