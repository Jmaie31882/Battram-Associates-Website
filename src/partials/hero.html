<section class="hero inner">
  <img src="{{hero_img}}" alt="{{hero_alt}}" fetchpriority="high">
  <div class="shade"></div>
  <div class="hero-copy">
    <span class="eyebrow rule">{{hero_eyebrow}}</span>
    <h1>{{hero_h1}}</h1>
    {{#if hero_sub}}<p class="sub">{{hero_sub}}</p>{{/if}}
    <p>{{hero_p}}</p>
    {{#if hero_cta}}<a class="text-link light" href="{{hero_href}}">{{hero_cta}} <span aria-hidden="true">→</span></a>{{/if}}
  </div>
</section>
